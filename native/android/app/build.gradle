plugins {
    id 'com.android.application'
}

android {
    namespace 'app.triplink.twa'
    compileSdk 34

    defaultConfig {
        applicationId "app.triplink.twa"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // signingConfig signingConfigs.release   // configure in ~/.gradle/gradle.properties or CI
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
