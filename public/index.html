<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TripLink – one link for every photo from the trip</title>
  <meta name="description" content="Create a trip, share one link, and every photo anyone takes lands in the same album. No sign-up, no app store.">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TripLink">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="loading">Loading TripLink…</div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <noscript>TripLink needs JavaScript to use your camera.</noscript>
  <script src="/qr.js"></script>
  <script src="/app.js"></script>
</body>
</html>
